server:
  # O Render define a porta pela variável PORT
  port: ${PORT:8080}
  # Render fica atrás de um proxy HTTPS: usa os cabeçalhos X-Forwarded-* para montar as URLs
  forward-headers-strategy: framework

spring:
  ai:
    mcp:
      server:
        name: financas
        version: 1.0.0
        type: SYNC
        protocol: STATELESS
        instructions: >
          Ferramentas do app de finanças pessoais do usuário. Valores em reais (BRL),
          datas no formato AAAA-MM-DD e meses no formato AAAA-MM. Use resumo_do_mes
          para visão geral, adicionar_gasto para lançar despesas e contas_a_vencer
          para lembrar o usuário de pagamentos.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/financas}
    username: ${DB_USER:financas}
    password: ${DB_PASS:financas}
    hikari:
      # Poucas conexões: o plano grátis do Neon tem limite
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}

app:
  # Endereço público da API (no Render: https://<seu-app>.onrender.com, sem barra no final)
  url: ${APP_URL:http://localhost:8080}
  jwt:
    # Em produção, defina a variável JWT_SECRET (mínimo 32 caracteres)
    secret: ${JWT_SECRET:dev-secret-troque-em-producao-0123456789abcdef}
    expiracao-dias: ${JWT_EXPIRACAO_DIAS:30}
  google:
    # Client ID do tipo "Aplicativo da Web" criado no Google Cloud
    client-id: ${GOOGLE_CLIENT_ID:}
    # Só para o botão "Entrar com Google" da página de login do conector do Claude
    client-secret: ${GOOGLE_CLIENT_SECRET:}
